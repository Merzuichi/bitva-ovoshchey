<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Битва овощей</title><link rel="icon" href="data:,">
<style>
:root{--ui:#151926ee;--ui2:#232a3d;--line:#343c56;--text:#eef1ff;--muted:#8d95b5;--accent:#7ddc4a;--gold:#ffcc33;--red:#ff5c6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}
body.aiming #game{cursor:none} /* на ПК вместо курсора — перекрестие прицела (drawAimReticle) */
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--ui);color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.ib.on{background:var(--accent);color:#0c2400;border-color:var(--accent)}
.ib:active{transform:scale(.92)}
.coins{background:var(--ui);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--gold);font-size:16px}
.dot{position:absolute;top:-3px;right:-3px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #151926}
.grow{flex:1}
/* видимость экранов */
.sb,.play,#menu{display:none}
body[data-screen=sandbox] .sb{display:flex}
body[data-screen=play] .play{display:flex}
body[data-screen=menu] #menu{display:flex}
/* песочница */
.bar{position:fixed;gap:6px;align-items:center;z-index:5}
#top{top:8px;left:8px;right:8px;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
.grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#tools{left:8px;top:58px;flex-direction:column}
#bottom{left:0;right:0;bottom:0;flex-direction:column;align-items:stretch;gap:0;background:var(--ui);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#cats{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
#cats::-webkit-scrollbar,#items::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 10px;border-radius:9px;cursor:pointer}
.cat.on{background:var(--ui2);color:var(--text)}
.teams{display:flex;align-items:center;gap:5px;margin-left:auto;padding-left:10px;flex:none;font-size:12px;color:var(--muted)}
.tm{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;font-size:12px;padding:0}
.tm.on{border-color:#fff;box-shadow:0 0 0 2px #0008}
#items{display:flex;gap:6px;padding:6px 8px 8px;overflow-x:auto;scrollbar-width:none}
.it{flex:none;width:68px;height:70px;border-radius:12px;background:var(--ui2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;font-size:11px;color:var(--muted);text-align:center;line-height:1.1}
.it b{font-size:28px;line-height:1;height:34px;display:flex;align-items:center;justify-content:center}
.spi{max-width:46px;max-height:34px;display:block}
.he .spi{max-width:44px;max-height:44px;margin:auto}.hch .spi{max-height:30px;max-width:40px}#hpico .spi{max-height:24px;max-width:28px}
.it.on{border-color:var(--accent);color:var(--text)}
.it.lock b{filter:grayscale(1) brightness(.6)}
.it .lk{position:absolute;top:2px;right:3px;font-size:10px;font-weight:800;color:var(--gold);background:#0009;border-radius:6px;padding:1px 4px}
.it .lk.ad{color:#fff;background:linear-gradient(135deg,#8a5cff,#d05cff)}
/* уровень */
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:5;align-items:flex-start;gap:8px;pointer-events:none}
#hud>*{pointer-events:auto}
.hp{background:var(--ui);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-width:160px}
.hp #hpico{font-size:22px}
#hpbar{flex:1;height:10px;background:#0008;border-radius:5px;overflow:hidden;min-width:90px}
#hpbar i{display:block;height:100%;width:100%;background:#5fdc4a;transition:width .2s}
#hpnum{font-weight:800;font-size:13px;min-width:26px;text-align:right}
.obj{flex:1;text-align:center;pointer-events:none}
.obj #lvname{font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(92,52,24,.5);font-weight:700}
.obj #obj{display:inline-block;margin-top:3px;background:var(--ui);border:1px solid var(--line);border-radius:10px;padding:5px 12px;font-weight:800;font-size:15px}
#controls{position:fixed;left:0;right:0;bottom:0;z-index:6;justify-content:space-between;padding:0 14px max(12px,env(safe-area-inset-bottom));pointer-events:none}
#controls .cl,#controls .cr{display:flex;gap:12px;pointer-events:auto;align-items:flex-end}
#controls button{width:68px;height:68px;border-radius:50%;touch-action:none;cursor:pointer;-webkit-user-select:none}
#controls button.atk{width:80px;height:80px}
#tip{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);z-index:7;background:#000c;border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:700;text-align:center;line-height:1.4;max-width:88%;opacity:0;transition:.4s;pointer-events:none;font-size:14px}
#tip.on{opacity:1;transform:translate(-50%,0)}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:7;font-size:40px;font-weight:900;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(92,52,24,.5),0 0 20px rgba(92,52,24,.5);opacity:0;pointer-events:none;white-space:nowrap}
#banner small{display:block;font-size:20px;margin-top:4px}
#banner.on{animation:ban 2s ease-out}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
/* меню */
#menu{position:fixed;inset:0;z-index:8;flex-direction:column;background:linear-gradient(180deg,#0b0e18bb,#0b0e1844 45%,#0b0e1800 62%);padding:10px;pointer-events:none}
#menu>*{pointer-events:auto}
.mtop{display:flex;gap:8px;align-items:center}
.mcenter{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;margin-top:-6px}
#menu h1{margin:0;font-size:46px;text-shadow:0 4px 0 #1d4d12,0 0 24px rgba(92,52,24,.5);letter-spacing:1px}
#menu .sub{margin:0 0 6px;color:#dfe6ff;text-shadow:0 1px 4px rgba(92,52,24,.5);font-weight:600}
.modes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.mode{display:flex;align-items:center;gap:10px;background:#151926e6;border:2px solid var(--line);border-radius:18px;padding:14px 18px;color:var(--text);cursor:pointer;min-width:190px;text-align:left;font-weight:800;font-size:18px}
.mode:hover{border-color:var(--accent)}.mode:active{transform:scale(.97)}
.mode b{font-size:36px}.mode small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
.heroesbtn{max-width:300px}
/* модалки */
#modal{position:fixed;inset:0;z-index:20;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}
#modal.on{display:flex}
.box{background:#151926;border:1px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%;max-height:94%;overflow:auto;animation:pop .2s ease-out;text-align:center}
.box.wide{max-width:620px}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.box.stay{animation:none} /* перерисовка уже открытого окна — без мигания (modal в ui.js) */
.box h3{margin:4px 0 6px;font-size:20px}
.box p{color:var(--muted);margin:4px 0 12px;font-size:14px;line-height:1.4}
.big{font-size:56px;line-height:1.1}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:8px;background:var(--ui2);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.ad{background:linear-gradient(135deg,#8a5cff,#d05cff);color:#fff}
.btn.g{background:var(--accent);color:#0c2400}.btn.y{background:var(--gold);color:#2a1e00}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:13px;flex:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.shop{display:flex;align-items:center;gap:10px;background:var(--ui2);border-radius:12px;padding:10px;margin-top:8px;text-align:left}
.shop .e{font-size:30px}.shop .t{flex:1;font-weight:700;font-size:14px}.shop .t small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.map{background:var(--ui2);border-radius:12px;padding:10px 4px;cursor:pointer;border:2px solid transparent;font-size:12px;font-weight:700}
.map b{display:block;font-size:30px}.map.on{border-color:var(--accent)}.mlk{color:var(--gold);font-size:11px}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.lvc{background:var(--ui2);border-radius:12px;padding:10px 4px;cursor:pointer;border:2px solid transparent}
.lvc:hover{border-color:var(--accent)}
.lvc b{font-size:22px;display:block}.lvc small{display:block;font-size:11px;color:var(--muted);min-height:28px;line-height:1.2;margin:2px 0}
.lvc.lock{opacity:.45}
.st{color:var(--gold);font-size:14px;letter-spacing:1px}.st span,.stars3 span{color:#ffffff22}
.stars3{font-size:40px;color:var(--gold);letter-spacing:4px}
.hlist{display:flex;flex-direction:column;gap:8px;text-align:left;margin:6px 0}
.hc{display:flex;align-items:center;gap:10px;background:var(--ui2);border-radius:14px;padding:10px;border:2px solid transparent;cursor:pointer}
.hc.sel{border-color:var(--accent)}.hc.lock .he{filter:grayscale(1) brightness(.6)}
.hc.big{align-items:flex-start;cursor:default}
.he{font-size:38px;width:50px;text-align:center;flex:none}
.hi{flex:1;min-width:0;font-size:15px}.hs{font-size:12px;color:var(--muted);margin-top:2px}
.upg{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.ur{display:flex;align-items:center;gap:8px;font-size:13px}
.ur>span:first-child{width:96px;flex:none}
.pips{display:flex;gap:2px;flex:1}.pips i{flex:1;height:8px;border-radius:2px;background:#ffffff1a}.pips i.f{background:var(--accent)}
.mx{color:var(--accent);font-size:12px;flex:none}
.wsel{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.wch{width:36px;height:36px;border-radius:10px;border:2px solid transparent;background:#0004;font-size:18px;cursor:pointer}
.wch.on{border-color:var(--gold);background:#ffcc3322}
.htop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tabs{display:flex;gap:4px;background:#0004;border-radius:12px;padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:800;padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.tabs button.on{background:var(--ui2);color:var(--text)}
.tabs.ctr{display:inline-flex;margin:2px auto 8px}
.rec{background:#0004;border-radius:12px;padding:6px;max-height:210px;overflow:auto;text-align:left}
.rec table{width:100%;border-collapse:collapse;font-size:14px}
.rec td{padding:7px 6px;border-bottom:1px solid #ffffff10}
.rec tr:last-child td{border-bottom:0}
.rec td.pl{width:34px;text-align:center;font-weight:800}
.rec td.nm{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec td.dt{color:var(--muted);font-size:12px;text-align:right}
.rec tr.me td{background:#7ddc4a22;color:#fff}
.rec .empty{color:var(--muted);text-align:center;padding:16px 8px;font-size:13px;line-height:1.4}
.besth{margin:8px 0;font-size:14px;color:var(--muted)}.besth b{color:var(--gold);font-size:16px}
.hsel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hch{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:8px 4px;border-radius:12px;border:2px solid transparent;background:var(--ui2);color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.hch b{font-size:28px;line-height:1}.hch.on{border-color:var(--accent);color:var(--text)}
.hch.lock b{filter:grayscale(1) brightness(.6)}.hch i{position:absolute;top:2px;right:4px;font-style:normal;font-size:11px}
.ctrt{text-align:center;margin-top:6px}
.mnote{font-size:12px;color:var(--muted);background:#0003;border-radius:10px;padding:7px 10px}
.acth{text-align:left;font-weight:800;font-size:15px;margin:12px 2px 6px}.acth.lock{opacity:.45}
.dtitle{font-size:12px;color:var(--muted);text-align:left;margin-bottom:8px;font-weight:700}
.dlg{display:flex;gap:12px;align-items:flex-start;text-align:left;min-height:120px}
.dpor{width:110px;height:110px;flex:none;border-radius:16px;background:var(--ui2);display:flex;align-items:center;justify-content:center;font-size:56px;overflow:hidden}
.dpor img{width:100%;height:100%;object-fit:contain}
.dtxt b{font-size:17px}.dtxt p{color:var(--text)!important;font-size:16px!important;margin-top:6px!important}
.wild{font-size:11px;background:#ff4545;color:#fff;border-radius:6px;padding:1px 6px;vertical-align:2px}
/* ===== графика интерфейса ===== */
.ico{height:1.15em;width:auto;vertical-align:-.24em;display:inline-block}
.ib .ico{height:28px;vertical-align:0}.coins .ico{height:24px}.cat .ico{height:18px;vertical-align:-4px}
.hs .ico,.hs .spi{height:15px!important;max-height:15px;width:auto;display:inline-block;vertical-align:-3px;margin:0}
.ur .ico{height:18px}
#menu .logo{width:auto;max-width:min(680px,88vw);height:min(190px,24vh);object-fit:contain;filter:drop-shadow(0 6px 12px #0009)}
#menu h1{line-height:0}
.mode b img{width:64px;height:64px;object-fit:contain;display:block}
.stars .ico{height:16px;vertical-align:-3px;margin:0 1px}.stars.big .ico{height:42px;margin:0 3px}
.lvc .chimg{width:100%;aspect-ratio:320/200;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}
.lvc.lock .chimg{filter:grayscale(1) brightness(.5)}
.lvc b{font-size:15px}
/* кнопки — 9-slice из ui_btn_*.png (инсет 24px) */
.btn{border:10px solid transparent;border-image:url(assets/ui/ui_btn_gray.png?v=20) 24 fill / 10px stretch;padding:3px 10px;color:#fff;text-shadow:0 1px 2px rgba(92,52,24,.5);border-radius:0;background:url(assets/ui/ui_btn_gray.png?v=20) 0 0/100% 100% no-repeat border-box}
.btn.g{border-image-source:url(assets/ui/ui_btn_green.png?v=20);color:#0b2600;text-shadow:0 1px 0 #ffffff66;background:url(assets/ui/ui_btn_green.png?v=20) 0 0/100% 100% no-repeat border-box}
.btn.y{border-image-source:url(assets/ui/ui_btn_yellow.png?v=20);color:#2a1e00;text-shadow:0 1px 0 #ffffff77;background:url(assets/ui/ui_btn_yellow.png?v=20) 0 0/100% 100% no-repeat border-box}
.btn.ad{border-image-source:url(assets/ui/ui_btn_ad.png?v=20);color:#fff;background:url(assets/ui/ui_btn_ad.png?v=20) 0 0/100% 100% no-repeat border-box}
.btn.sm{border-width:8px;border-image-width:8px;padding:1px 6px;--bw:8px}
/* окна — 9-slice из ui_panel.png (инсет 36px) */
.box{border:18px solid transparent;border-image:url(assets/ui/ui_panel.png?v=20) 36 fill / 18px stretch;background:none;padding:4px 6px;border-radius:0;background:url(assets/ui/ui_panel.png?v=20) 0 0/100% 100% no-repeat border-box}
/* кнопки управления */
/* картинки кнопок: только background-image/size, без сокращённого background — иначе он сбрасывает картинку */
#controls button{border:0;padding:0;background-color:transparent;background-position:center;background-size:contain;background-repeat:no-repeat;font-size:0;color:transparent;transition:transform .06s,filter .06s}
#controls button[data-k=left]{background-image:url(assets/ui/ui_ctrl_left.png?v=20)}
#controls button[data-k=right]{background-image:url(assets/ui/ui_ctrl_right.png?v=20)}
#controls button[data-k=jump]{background-image:url(assets/ui/ui_ctrl_jump.png?v=20)}
#controls button[data-k=attack]{background-image:url(assets/ui/ui_ctrl_attack.png?v=20)}
#controls button.on{filter:brightness(1.2);transform:scale(.9)}
.map .mprev{width:100%;aspect-ratio:400/240;object-fit:cover;border-radius:8px;display:block;margin-bottom:4px}.map.locked .mprev{filter:grayscale(.8) brightness(.6)}
.acth{position:relative;border-radius:12px;overflow:hidden;margin:12px 0 6px!important}
.actimg{width:100%;aspect-ratio:1200/400;object-fit:cover;display:block}
.acth span{position:absolute;left:10px;bottom:8px;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(92,52,24,.5),0 0 8px rgba(92,52,24,.5)}
.acth.lock .actimg{filter:grayscale(.8) brightness(.55)}
#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:700;font-size:14px;animation:pop .2s;white-space:nowrap}
#loading{position:fixed;inset:0;z-index:50;background:#1b2233;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:26px;gap:8px}
#loading small{color:var(--muted);font-size:13px;font-weight:500}
/* патроны, головоломки, карта глав */
#ammo{display:flex;gap:2px;align-items:center;margin-left:4px;min-width:20px}
#ammo i{width:4px;height:12px;border-radius:2px;background:#ffd23a;box-shadow:0 0 0 1px #0008}
#ammo b{font-size:11px;color:#ffd23a}#ammo.low i{background:#ff7a3a}
#ammo .rl{display:inline-block;color:#ffd23a;font-weight:900;font-size:16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hud .grp{display:flex;gap:6px}
#pRestart{font-size:22px;font-weight:900}
body:not(.puzzle) #pRestart{display:none}
body.puzzle #controls{display:none}
body.shot #toast{display:none}
.legend{font-size:12px;color:var(--muted);margin:-4px 0 4px}
.lvc{position:relative}
.lvc .ty{position:absolute;top:6px;left:6px;font-style:normal;font-size:13px;background:#000a;border-radius:8px;padding:1px 5px}
.lvc .ty .ico{height:14px}
.lvc.boss{border-color:#ffcc3355}.lvc.next{border-color:var(--accent);box-shadow:0 0 12px #7ddc4a66}
.acth em{position:absolute;right:10px;bottom:8px;font-style:normal;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(92,52,24,.5)}

/* =================== Тема «Солнечный огород» (assets/ui, набор sunny-garden) =================== */
/* текст в светлых окнах и на деревянных панелях — тёмно-коричневый */
.box,#bottom,.toast,#tip,#obj{--text:#3a2518;--muted:#7a5638;--ink:#3a2518}
.box{color:var(--text)}
.box p,.box .small{color:var(--muted)}
/* заголовок окна — красная лента */
.box h3{display:table;margin:-4px auto 10px;min-width:58%;padding:9px 6px 15px;font-size:19px;font-weight:900;color:#fff4dc;text-shadow:0 2px 0 #7a1a12,0 0 3px #7a1a12;
 border-style:solid;border-color:transparent;border-width:0 38px;border-image:url(assets/ui/ui_ribbon.png?v=20) 0 120 fill / 0 38px stretch;line-height:1.2;background:url(assets/ui/ui_ribbon.png?v=20) 0 0/100% 100% no-repeat border-box}
/* кнопки: светлый текст с тёмной тенью, на жёлтой — тёмный */
.btn{color:#fff4dc;text-shadow:0 2px 0 rgba(92,52,24,.5),0 0 2px rgba(92,52,24,.5);font-weight:900}
.btn.g,.btn.ad,.btn.r,.btn.b{color:#fff4dc;text-shadow:0 2px 0 rgba(92,52,24,.5),0 0 2px rgba(92,52,24,.5)}
.btn.y{color:#3a2518;text-shadow:0 1px 0 #fff6}
.btn.r{border-image-source:url(assets/ui/ui_btn_red.png?v=20);background:url(assets/ui/ui_btn_red.png?v=20) 0 0/100% 100% no-repeat border-box}.btn.b{border-image-source:url(assets/ui/ui_btn_blue.png?v=20);background:url(assets/ui/ui_btn_blue.png?v=20) 0 0/100% 100% no-repeat border-box}
/* кнопки-иконки: рамка из дерева и листьев, включённая — жёлтая */

 background:#3a2518!important;border-radius:99px!important;padding:calc(5*var(--u)) calc(6*var(--u)) calc(5*var(--u)) calc(28*var(--u));box-shadow:0 calc(4*var(--u)) 0 #0005;overflow:visible!important}
